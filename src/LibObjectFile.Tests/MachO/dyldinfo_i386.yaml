# Models a 10.7-era i386 executable: 32-bit segments combined with the modern
# LC_MAIN entry point and LC_DYLD_INFO_ONLY opcode streams. No current linker
# emits that combination, since 32-bit Mach-O support was dropped while those
# commands were still in use, so it has to be synthesized to be tested at all.
--- !mach-o
FileHeader:
  magic:      0xFEEDFACE
  cputype:    0x00000007
  cpusubtype: 0x00000003
  filetype:   0x00000002
  ncmds:      16
  sizeofcmds: 720
  flags:      0x00218085
LoadCommands:
  - cmd:      LC_SEGMENT
    cmdsize:  56
    segname:  __PAGEZERO
    vmaddr:   0
    vmsize:   4096
    fileoff:  0
    filesize: 0
    maxprot:  0
    initprot: 0
    nsects:   0
    flags:    0
  - cmd:      LC_SEGMENT
    cmdsize:  124
    segname:  __TEXT
    vmaddr:   4096
    vmsize:   4096
    fileoff:  0
    filesize: 4096
    maxprot:  7
    initprot: 5
    nsects:   1
    flags:    0
    Sections:
      - sectname:  __text
        segname:   __TEXT
        addr:      0x1800
        size:      6
        offset:    0x800
        align:     2
        reloff:    0
        nreloc:    0
        flags:     0x80000400
        reserved1: 0
        reserved2: 0
        content:   'B82A000000C3'
  - cmd:      LC_SEGMENT
    cmdsize:  124
    segname:  __DATA
    vmaddr:   8192
    vmsize:   4096
    fileoff:  4096
    filesize: 4096
    maxprot:  7
    initprot: 3
    nsects:   1
    flags:    0
    Sections:
      - sectname:  __data
        segname:   __DATA
        addr:      0x2000
        size:      4
        offset:    0x1000
        align:     2
        reloff:    0
        nreloc:    0
        flags:     0x00000000
        reserved1: 0
        reserved2: 0
        content:   '2A000000'
  - cmd:      LC_SEGMENT
    cmdsize:  56
    segname:  __LINKEDIT
    vmaddr:   12288
    vmsize:   4096
    fileoff:  8192
    filesize: 64
    maxprot:  7
    initprot: 1
    nsects:   0
    flags:    0
  - cmd:             LC_DYLD_INFO_ONLY
    cmdsize:         48
    rebase_off:      0
    rebase_size:     0
    bind_off:        0
    bind_size:       0
    weak_bind_off:   0
    weak_bind_size:  0
    lazy_bind_off:   0
    lazy_bind_size:  0
    export_off:      8192
    export_size:     2
  - cmd:     LC_SYMTAB
    cmdsize: 24
    symoff:  8194
    nsyms:   2
    stroff:  8218
    strsize: 24
  - cmd:            LC_DYSYMTAB
    cmdsize:        80
    ilocalsym:      0
    nlocalsym:      0
    iextdefsym:     0
    nextdefsym:     2
    iundefsym:      2
    nundefsym:      0
    tocoff:         0
    ntoc:           0
    modtaboff:      0
    nmodtab:        0
    extrefsymoff:   0
    nextrefsyms:    0
    indirectsymoff: 0
    nindirectsyms:  0
    extreloff:      0
    nextrel:        0
    locreloff:      0
    nlocrel:        0
  - cmd:     LC_LOAD_DYLINKER
    cmdsize: 28
    name:    12
    Content: '/usr/lib/dyld'
    ZeroPadBytes: 1
  - cmd:     LC_UUID
    cmdsize: 24
    uuid:    4D4F4445-524E-3332-4249-540000000002
  - cmd:     LC_VERSION_MIN_MACOSX
    cmdsize: 16
    version: 0x000A0700
    sdk:     0x000A0700
  - cmd:     LC_SOURCE_VERSION
    cmdsize: 16
    version: 0
  - cmd:       LC_MAIN
    cmdsize:   24
    entryoff:  2048
    stacksize: 0
  - cmd:      LC_FUNCTION_STARTS
    cmdsize:  16
    dataoff:  8248
    datasize: 8
  - cmd:      LC_DATA_IN_CODE
    cmdsize:  16
    dataoff:  8256
    datasize: 0
  - cmd:      LC_DYLIB_CODE_SIGN_DRS
    cmdsize:  16
    dataoff:  8256
    datasize: 0
  - cmd:                LC_LOAD_DYLIB
    cmdsize:            52
    dylib:
      name:             24
      timestamp:        2
      current_version:  0x004F0901
      compatibility_version: 0x00010000
    Content:            '/usr/lib/libSystem.B.dylib'
    ZeroPadBytes:       2
LinkEditData:
  NameList:
    - n_strx:  2
      n_type:  0x0F
      n_sect:  1
      n_desc:  0x0010
      n_value: 2048
    - n_strx:  8
      n_type:  0x0F
      n_sect:  2
      n_desc:  0
      n_value: 8192
  StringTable:
    - ' '
    - _main
    - _dyldinfo_data
